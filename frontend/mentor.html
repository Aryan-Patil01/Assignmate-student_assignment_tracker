<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATS — Mentor Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; background: #f0f4ff; overflow: hidden; }

.sidebar {
  width: 240px; flex-shrink: 0;
  background: linear-gradient(160deg, #0f0c29, #1a1060, #24243e);
  display: flex; flex-direction: column; padding: 1.5rem 1rem; position: relative; overflow: hidden;
}
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.25; }
.orb1 { width: 250px; height: 250px; background: #f59e0b; top: -80px; right: -80px; }
.orb2 { width: 200px; height: 200px; background: #6366f1; bottom: -60px; left: -60px; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 30px 30px; }
.sidebar-inner { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; padding: 0.5rem; }
.brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 6px 18px rgba(245,158,11,0.5); }
.brand-name { font-size: 1.1rem; font-weight: 800; color: white; letter-spacing: -0.02em; }
.brand-tag { font-size: 0.6rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.1em; }
.nav-section { font-size: 0.6rem; font-weight: 700; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.12em; padding: 0 0.5rem; margin: 1rem 0 0.4rem; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 0.6rem 0.75rem; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.45); margin-bottom: 2px; }
.nav-item:hover { background: rgba(255,255,255,0.07); color: white; }
.nav-item.active { background: rgba(245,158,11,0.2); color: white; border-left: 3px solid #f59e0b; }
.nav-icon { font-size: 0.95rem; width: 18px; text-align: center; }
.sidebar-bottom { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
.user-card { display: flex; align-items: center; gap: 9px; padding: 0.6rem 0.5rem; border-radius: 10px; background: rgba(255,255,255,0.05); margin-bottom: 0.6rem; }
.user-av { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 800; color: white; flex-shrink: 0; }
.user-name { font-size: 0.8rem; font-weight: 700; color: white; }
.user-role-lbl { font-size: 0.62rem; color: rgba(255,255,255,0.35); }
.logout-btn { width: 100%; padding: 0.55rem; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 9px; color: #fca5a5; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
.logout-btn:hover { background: rgba(239,68,68,0.2); }

.main { flex: 1; background: white; position: relative; overflow-y: auto; }
.main::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(245,158,11,0.04) 1px, transparent 0); background-size: 24px 24px; pointer-events: none; }
.main-inner { position: relative; z-index: 1; padding: 2rem 2.5rem; }
.page-header { margin-bottom: 2rem; }
.page-title { font-size: 1.6rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em; }
.page-sub { font-size: 0.85rem; color: #94a3b8; margin-top: 0.2rem; }
.section { display: none; animation: fadeUp 0.3s ease; }
.section.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Students grid */
.students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.student-card {
  background: #fafafa; border: 1.5px solid #f1f5f9; border-radius: 16px;
  padding: 1.4rem; transition: all 0.25s; display: flex; align-items: center; gap: 1rem;
}
.student-card:hover { border-color: #fde68a; transform: translateY(-3px); box-shadow: 0 10px 24px rgba(245,158,11,0.1); }
.s-avatar {
  width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; font-weight: 900; color: white;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
}
.s-name { font-size: 0.925rem; font-weight: 800; color: #0f172a; }
.s-email { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

/* Feedback section */
.sub-select-wrap { margin-bottom: 1.5rem; }
select {
  padding: 0.75rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 11px;
  font-size: 0.875rem; color: #0f172a; outline: none; max-width: 420px; width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif; background: white; transition: all 0.2s;
}
select:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }

.sub-card { background: #fafafa; border: 1.5px solid #f1f5f9; border-radius: 16px; padding: 1.4rem; margin-bottom: 0.75rem; transition: all 0.2s; }
.sub-card:hover { border-color: #fde68a; }
.sub-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
.sub-sname { font-size: 0.9rem; font-weight: 800; color: #0f172a; }
.sub-semail { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

.sub-text-box { background: white; border: 1.5px solid #f1f5f9; border-radius: 10px; padding: 0.85rem; margin-bottom: 1rem; font-size: 0.85rem; color: #475569; line-height: 1.6; }
.sub-file-link { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem; border-radius: 8px; background: #ede9fe; border: 1px solid #ddd6fe; color: #7c3aed; font-size: 0.78rem; font-weight: 700; text-decoration: none; margin-bottom: 0.75rem; transition: all 0.2s; }
.sub-file-link:hover { background: #ddd6fe; }

.grade-row { display: grid; grid-template-columns: 1fr 2fr; gap: 0.75rem; }
.form-label { font-size: 0.72rem; font-weight: 700; color: #475569; margin-bottom: 5px; display: block; }
input[type="text"] { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 0.875rem; color: #0f172a; outline: none; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
input[type="text"]:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
input[type="text"]::placeholder { color: #c0c9d8; }

.save-row { display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; }
.btn-save { padding: 0.55rem 1.1rem; background: #fef3c7; border: 1px solid #fde68a; color: #92400e; border-radius: 9px; font-size: 0.78rem; font-weight: 800; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
.btn-save:hover { background: #fde68a; }
.save-msg { font-size: 0.8rem; font-weight: 700; color: #059669; }

.not-submitted { font-size: 0.8rem; color: #94a3b8; font-style: italic; padding: 0.4rem 0; }

.badge { padding: 0.22rem 0.7rem; border-radius: 20px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.badge-submitted { background: #d1fae5; color: #065f46; }
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-late { background: #fee2e2; color: #991b1b; }

.empty-state { text-align: center; padding: 3rem 2rem; color: #94a3b8; }
.empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-title { font-size: 0.95rem; font-weight: 700; color: #475569; margin-bottom: 0.3rem; }

.skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.toast-wrap { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: 0.5rem; }
.toast { padding: 0.85rem 1.25rem; border-radius: 12px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem; min-width: 260px; animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.toast.success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #15803d; }
.toast.error { background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626; }
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>

<div class="sidebar">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="grid-bg"></div>
  <div class="sidebar-inner">
    <div class="brand">
      <div class="brand-icon">🧑‍💼</div>
      <div>
        <div class="brand-name">SATS</div>
        <div class="brand-tag">Mentor Panel</div>
      </div>
    </div>

    <div class="nav-section">Workspace</div>
    <div class="nav-item active" onclick="showSection('students',this)">
      <span class="nav-icon">👥</span> My Students
    </div>
    <div class="nav-item" onclick="showSection('feedback',this)">
      <span class="nav-icon">📝</span> Give Feedback
    </div>

    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-av" id="user-av">M</div>
        <div>
          <div class="user-name" id="mentor-name">Mentor</div>
          <div class="user-role-lbl">Mentor</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">↩ Sign Out</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="main-inner">

    <!-- Students -->
    <div class="section active" id="students">
      <div class="page-header">
        <div class="page-title">My Students</div>
        <div class="page-sub">Students assigned to you for mentoring</div>
      </div>
      <div class="students-grid" id="students-list">
        <div class="skeleton" style="height:96px;border-radius:16px;"></div>
        <div class="skeleton" style="height:96px;border-radius:16px;"></div>
      </div>
    </div>

    <!-- Feedback -->
    <div class="section" id="feedback">
      <div class="page-header">
        <div class="page-title">Give Feedback</div>
        <div class="page-sub">Review submissions and provide grades to students</div>
      </div>
      <div class="sub-select-wrap">
        <div class="form-label">Select Assignment</div>
        <select id="feedback-select" onchange="loadFeedbackSubs()">
          <option value="">— Choose an assignment —</option>
        </select>
      </div>
      <div id="feedback-list"></div>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:5000/api';
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const name = localStorage.getItem('name');

// ── Auth Guard ──────────────────────────────────────────────
(function guardPage() {
    if (!token || !role) {
        window.location.replace('index.html'); throw new Error('No session');
    }
    if (role !== 'mentor') {
        const map = { admin:'admin.html', student:'student.html', teacher:'teacher.html' };
        window.location.replace(map[role] || 'index.html');
        throw new Error('Wrong role');
    }
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.exp && Date.now() / 1000 > payload.exp) {
            localStorage.clear();
            window.location.replace('index.html');
            throw new Error('Token expired');
        }
    } catch(e) { if (e.message === 'Token expired') throw e; }
})();
// ────────────────────────────────────────────────────────────

document.getElementById('mentor-name').textContent = name || 'Mentor';
document.getElementById('user-av').textContent = name ? name.charAt(0).toUpperCase() : 'M';

const hr = new Date().getHours();
document.getElementById('greeting') &&
    (document.getElementById('greeting').textContent =
        `${hr<12?'Good morning':hr<17?'Good afternoon':'Good evening'}, ${name?.split(' ')[0]||'Mentor'} 👋`);

  const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  function toast(msg, type='success') {
    const tc = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${type==='success'?'✅':'❌'}</span>${msg}`;
    tc.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  function showSection(sec, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(sec).classList.add('active');
    el.classList.add('active');
    if (sec==='students') loadStudents();
    if (sec==='feedback') loadAssignmentSelect();
  }

  async function loadStudents() {
    const res = await fetch(`${API}/mentor/students`, {headers});
    const data = await res.json();
    const el = document.getElementById('students-list');
    if (!data.length) { el.innerHTML='<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">No students assigned yet</div></div>'; return; }
    el.innerHTML = data.map(s=>`
      <div class="student-card">
        <div class="s-avatar">${s.name[0].toUpperCase()}</div>
        <div><div class="s-name">${s.name}</div><div class="s-email">${s.email}</div></div>
      </div>`).join('');
  }

  async function loadAssignmentSelect() {
    const res = await fetch(`${API}/assignments`, {headers});
    const data = await res.json();
    const sel = document.getElementById('feedback-select');
    if (!data.length) { sel.innerHTML='<option>No assignments found</option>'; return; }
    sel.innerHTML = '<option value="">— Choose an assignment —</option>' +
      data.map(a=>`<option value="${a._id}">${a.title} — ${a.subject}</option>`).join('');
  }

  async function loadFeedbackSubs() {
    const id = document.getElementById('feedback-select').value;
    if (!id) return;
    const res = await fetch(`${API}/submissions/assignment/${id}`, {headers});
    const data = await res.json();
    const el = document.getElementById('feedback-list');
    if (!data.length) { el.innerHTML='<div class="empty-state"><div class="empty-icon">📬</div><div class="empty-title">No submissions yet</div></div>'; return; }
    el.innerHTML = data.map(s=>`
      <div class="sub-card">
        <div class="sub-header">
          <div><div class="sub-sname">${s.studentId.name}</div><div class="sub-semail">${s.studentId.email}</div></div>
          <span class="badge badge-${s.status}">${s.status}</span>
        </div>
        ${s.submittedText?`<div class="sub-text-box">${s.submittedText}</div>`:'<div class="not-submitted">No text submitted</div>'}
        ${s.fileUrl?`<a class="sub-file-link" href="${API.replace('/api','')}/uploads/${s.fileUrl}" target="_blank">📎 ${s.fileName||'Download'}</a><br>`:''}
        ${s.status!=='pending'?`
          <div class="grade-row">
            <div><div class="form-label">Grade</div><input type="text" id="grade-${s._id}" value="${s.grade||''}" placeholder="A, B+, 85..."></div>
            <div><div class="form-label">Feedback</div><input type="text" id="fb-${s._id}" value="${s.feedback||''}" placeholder="Great work on..."></div>
          </div>
          <div class="save-row">
            <button class="btn-save" onclick="saveFeedback('${s._id}')">💾 Save Feedback</button>
            <span class="save-msg" id="msg-${s._id}"></span>
          </div>` : '<div class="not-submitted">Student has not submitted yet</div>'}
      </div>`).join('');
  }

  async function saveFeedback(subId) {
    const grade = document.getElementById(`grade-${subId}`).value;
    const feedback = document.getElementById(`fb-${subId}`).value;
    await fetch(`${API}/submissions/feedback/${subId}`, {method:'PUT',headers,body:JSON.stringify({grade,feedback})});
    document.getElementById(`msg-${subId}`).textContent='✅ Saved!';
    toast('Feedback saved!');
  }

  loadStudents();
</script>
</body>
</html>
